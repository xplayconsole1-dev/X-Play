<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="100%" height="100%">
  <defs>
    <linearGradient id="glacierIceBrandGrad" x1="0%" y1="0%" x2="30%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="iceBrandGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0284C7" flood-opacity="0.30" />
    </filter>
  </defs>
  <!-- Hero Dual-Chevron Emblem -->
  <g filter="url(#iceBrandGlow)">
    <polygon points="588.8,305.4 438.1,155.0 360.0,155.0 538.6,350.0 360.0,545.0 438.1,545.0 588.8,394.6" fill="url(#glacierIceBrandGrad)" />
    <polygon points="611.2,305.4 761.9,155.0 840.0,155.0 661.4,350.0 840.0,545.0 761.9,545.0 611.2,394.6" fill="url(#glacierIceBrandGrad)" />
    
    <!-- Stylized 'X' in wordmark -->
    <polygon points="351.3,735.1 301.0,685.0 275.0,685.0 334.5,750.0 275.0,815.0 301.0,815.0 351.3,764.9" fill="url(#glacierIceBrandGrad)" />
    <polygon points="358.7,735.1 409.0,685.0 435.0,685.0 375.5,750.0 435.0,815.0 409.0,815.0 358.7,764.9" fill="url(#glacierIceBrandGrad)" />
  </g>
  
  <!-- 'Play' Typography -->
  <text x="445" y="805" font-family="'Segoe UI', 'Outfit', sans-serif" font-size="165" font-weight="600" fill="url(#glacierIceBrandGrad)" letter-spacing="1">Play</text>
  
  <!-- Tagline -->
  <text x="600" y="900" font-family="'Bahnschrift', 'Segoe UI', sans-serif" font-size="44" font-weight="600" fill="#0284C7" text-anchor="middle" letter-spacing="8">YOUR POCKET CONSOLE</text>
</svg>